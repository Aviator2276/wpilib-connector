[project]
name = "websimd"
version = "2.0.0"
description = "WPILib Web Sim daemon: serves the browser Sim GUI and relays NetworkTables, HAL and camera streams to it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
fast = ["uvloop>=0.19; sys_platform != 'win32'", "orjson>=3.9"]

[project.scripts]
websimd = "websimd.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["websimd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S104", "S311", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
