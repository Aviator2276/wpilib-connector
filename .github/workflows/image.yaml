name: workspace-image

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aviator2276/wpilib-workspace

jobs:
  # linux/amd64 only: that is what the Coder deployment runs. Nothing in the
  # Dockerfile is amd64-specific (the bridge is compiled for the target
  # architecture), so another platform is a matter of adding it here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          platforms: linux/amd64
          load: true
          tags: wpilib-workspace:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Start the image as a workspace would, simulate a robot in it, and run
      # the end-to-end suite and the vendor matrix (including PhotonLib).
      - name: test the image end to end
        run: bash tests/ci/run-in-image.sh wpilib-workspace:dev
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:2026
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
